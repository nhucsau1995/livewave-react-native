# Stills for the README: one per key screen, taken at the top of each screen once its content
# is visible. Real taps on testIDs (no deep links). No clearState: the warm-up launch reset it.
appId: com.livewave.app
---
- launchApp
- runFlow:
    when:
      visible: ".*isn't responding.*"
    commands:
      - tapOn: "Wait"
- extendedWaitUntil:
    visible: "Get started"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-welcome
- tapOn:
    id: "get-started"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible: "Nobody you follow is live"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-home-empty
- tapOn:
    id: "follow-lena"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible: "Friday Night House Set"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-home
- tapOn:
    id: "tab-explore"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible: "Trending"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-explore
- scrollUntilVisible:
    element:
      id: "rising-lena"
    direction: DOWN
- tapOn:
    id: "rising-lena"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible: "Watch live"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-creator-profile
- tapOn:
    id: "watch-live"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible: "Say something.*"
    timeout: 15000
- tapOn:
    id: "watch-heart"
    waitToSettleTimeoutMs: 1500
- tapOn:
    id: "watch-cc"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible: "LIVE CAPTIONS"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 06-watch-live
- tapOn:
    id: "watch-gift"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible: "Send a gift"
    timeout: 15000
- tapOn:
    id: "gift-rocket"
    waitToSettleTimeoutMs: 1500
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 07-gift-sheet
- tapOn:
    id: "send-gift"
    waitToSettleTimeoutMs: 1500
- tapOn:
    id: "watch-close"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible: "Watch live"
    timeout: 15000
- tapOn:
    id: "back"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible: "Rising creators"
    timeout: 15000
- tapOn:
    id: "tab-golive"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible: "Stream title"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 08-go-live-setup
- tapOn:
    id: "go-live"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible: "End"
    timeout: 15000
- extendedWaitUntil:
    visible: "Sofia"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 09-host-live
- tapOn:
    id: "open-health"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible: "Upload bitrate"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 10-stream-health
- tapOn:
    id: "back"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible: "End"
    timeout: 15000
- tapOn:
    id: "end-stream"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible: "Stream ended"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 11-live-summary
- scrollUntilVisible:
    element:
      id: "back-home"
    direction: DOWN
- tapOn:
    id: "back-home"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible: "Friday Night House Set"
    timeout: 15000
- tapOn:
    id: "tab-wallet"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible: "Coin balance"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 12-wallet
- tapOn:
    id: "tab-profile"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible: "This week"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 13-profile
- tapOn:
    id: "open-settings"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible: "Auto-reconnect"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 14-stream-settings
